<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>慧研鉴证｜论文科研数据异常筛查 Agent</title>
  <style>
    :root {
      color-scheme: light;
      --bg: #eef3f9;
      --shell: rgba(250, 252, 255, .92);
      --side: rgba(244, 247, 252, .92);
      --surface: #ffffff;
      --surface-2: #f7f9fc;
      --line: #e2e9f2;
      --line-strong: #d3deea;
      --text: #152033;
      --muted: #75849a;
      --blue: #1688ff;
      --blue-2: #3a9aff;
      --blue-soft: #eaf4ff;
      --cyan: #48c5d8;
      --green: #25b985;
      --green-soft: #e9f9f3;
      --amber: #e6a23c;
      --amber-soft: #fff6e5;
      --red: #ed6565;
      --red-soft: #fff0f0;
      --purple: #8d7cf3;
      --purple-soft: #f1efff;
      --shadow: 0 20px 70px rgba(27, 48, 78, .12);
      font-family: Arial, "Microsoft YaHei", sans-serif;
      font-size: 13px;
    }

    * { box-sizing: border-box; }
    html, body { margin: 0; min-height: 100%; color: var(--text); }
    body {
      min-height: 100vh;
      overflow: hidden;
      background:
        radial-gradient(circle at 8% -6%, rgba(40, 141, 255, .16), transparent 30%),
        radial-gradient(circle at 92% 4%, rgba(50, 199, 157, .13), transparent 30%),
        linear-gradient(135deg, #fafcff 0%, #edf3f9 58%, #e7edf5 100%);
    }
    button, input, select, textarea { font: inherit; color: inherit; }
    button { cursor: pointer; }
    .app-shell {
      width: min(1540px, calc(100vw - 28px));
      height: min(970px, calc(100vh - 28px));
      margin: 14px auto;
      display: grid;
      grid-template-columns: 248px minmax(0, 1fr);
      overflow: hidden;
      border: 1px solid rgba(255,255,255,.95);
      border-radius: 24px;
      background: var(--shell);
      box-shadow: var(--shadow);
      backdrop-filter: blur(24px) saturate(1.12);
    }
    .sidebar {
      display: grid;
      grid-template-rows: auto auto minmax(0,1fr) auto;
      min-width: 0;
      border-right: 1px solid rgba(210, 220, 233, .9);
      background: var(--side);
      backdrop-filter: blur(20px);
    }
    .traffic { display: flex; gap: 8px; padding: 14px 15px 5px; }
    .traffic i { width: 12px; height: 12px; border-radius: 50%; display: block; box-shadow: inset 0 0 0 1px rgba(0,0,0,.07); }
    .traffic i:nth-child(1) { background:#ff6159; }
    .traffic i:nth-child(2) { background:#ffbd2e; }
    .traffic i:nth-child(3) { background:#28c941; }
    .brand {
      display: grid;
      grid-template-columns: 44px 1fr;
      gap: 10px;
      align-items: center;
      padding: 7px 15px 15px;
      border-bottom: 2px solid rgba(211, 221, 234, .75);
    }
    .brand-mark {
      width: 44px; height: 44px; position: relative; display: grid; place-items: center;
      border-radius: 15px; color: white; font-size: 20px; font-weight: 800;
      background: linear-gradient(145deg, #43b9ff, #1778ef 62%, #5d67e9);
      box-shadow: 0 9px 22px rgba(22,136,255,.25);
    }
    .brand-mark::before { content:""; position:absolute; inset:7px; border:1.5px solid rgba(255,255,255,.72); border-radius:50%; }
    .brand-mark b { position: relative; letter-spacing: -2px; }
    .brand strong { display:block; font-size:15px; letter-spacing:-.2px; line-height:1.25; }
    .brand small { display:block; margin-top:4px; color:var(--muted); font-size:11px; }
    .nav-wrap { min-height:0; overflow:auto; padding:12px 11px; scrollbar-width:thin; }
    .nav-group-title { padding: 10px 12px 7px; color:#9aa6b5; font-size:10px; font-weight:700; letter-spacing:1.1px; }
    .nav-item {
      width:100%; min-height:38px; display:flex; align-items:center; gap:10px;
      margin:2px 0; padding:0 12px; border:1px solid transparent; border-radius:11px;
      background:transparent; color:#4b586b; text-align:left; transition:.16s ease;
    }
    .nav-item:hover { background:rgba(255,255,255,.72); color:#256eb8; }
    .nav-item.active { background:white; color:#1478d6; border-color:#edf1f6; box-shadow:0 7px 18px rgba(49,78,112,.07); font-weight:650; }
    .nav-item svg { width:18px; height:18px; stroke:currentColor; fill:none; stroke-width:1.8; stroke-linecap:round; stroke-linejoin:round; flex:0 0 auto; }
    .nav-item .count { margin-left:auto; min-width:21px; height:19px; padding:0 6px; display:grid; place-items:center; border-radius:10px; background:#eef3f8; color:#718096; font-size:10px; }
    .nav-item.active .count { background:var(--blue-soft); color:var(--blue); }
    .side-footer { padding:10px 11px 13px; border-top:1px solid rgba(218,226,236,.75); }
    .console-chip { display:flex; align-items:center; gap:9px; padding:9px 11px; border-radius:12px; background:rgba(255,255,255,.72); border:1px solid #e8edf4; }
    .console-chip .dot { width:8px; height:8px; background:var(--green); border-radius:50%; box-shadow:0 0 0 4px rgba(37,185,133,.12); }
    .console-chip span { flex:1; min-width:0; }
    .console-chip small { display:block; color:var(--muted); margin-top:2px; font-size:10px; }
    .main { min-width:0; min-height:0; display:grid; grid-template-rows:66px minmax(0,1fr); }
    .topbar { display:flex; align-items:center; gap:14px; padding:0 22px; border-bottom:1px solid rgba(223,231,240,.88); background:rgba(255,255,255,.54); backdrop-filter:blur(18px); }
    .page-title { min-width:0; flex:1; }
    .page-title h1 { margin:0; font-size:20px; letter-spacing:-.4px; }
    .page-title p { margin:4px 0 0; color:var(--muted); font-size:11.5px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
    .console-select { height:36px; min-width:150px; border:1px solid var(--line); border-radius:11px; padding:0 30px 0 11px; background:white; outline:none; }
    .icon-btn { width:36px; height:36px; display:grid; place-items:center; border:1px solid var(--line); border-radius:11px; background:white; color:#6d7a8c; position:relative; }
    .icon-btn:hover { border-color:#bddcff; color:var(--blue); }
    .icon-btn svg { width:18px; height:18px; stroke:currentColor; fill:none; stroke-width:1.8; stroke-linecap:round; stroke-linejoin:round; }
    .notify-dot { position:absolute; top:7px; right:7px; width:6px; height:6px; background:var(--red); border:2px solid white; border-radius:50%; }
    .avatar { width:36px; height:36px; border-radius:12px; background:linear-gradient(145deg,#d8edff,#eef7ff); display:grid; place-items:center; color:#2678c7; font-weight:800; border:1px solid #cfe4f8; }
    .content { min-width:0; min-height:0; overflow:auto; padding:20px 22px 26px; scroll-behavior:smooth; }
    .content::-webkit-scrollbar, .nav-wrap::-webkit-scrollbar { width:7px; }
    .content::-webkit-scrollbar-thumb, .nav-wrap::-webkit-scrollbar-thumb { background:#d7e0eb; border-radius:10px; }
    .page-head { display:flex; justify-content:space-between; gap:18px; align-items:flex-start; margin-bottom:16px; }
    .page-head h2 { margin:0; font-size:22px; letter-spacing:-.45px; }
    .page-head p { margin:6px 0 0; color:var(--muted); line-height:1.6; max-width:760px; }
    .actions { display:flex; align-items:center; gap:9px; flex-wrap:wrap; }
    .btn { height:36px; display:inline-flex; align-items:center; justify-content:center; gap:7px; padding:0 14px; border:1px solid var(--line-strong); border-radius:11px; background:white; color:#445268; font-weight:600; transition:.15s; }
    .btn:hover { transform:translateY(-1px); box-shadow:0 6px 15px rgba(35,64,97,.09); }
    .btn.primary { color:white; border-color:var(--blue); background:linear-gradient(135deg,#2294ff,#167af0); box-shadow:0 8px 18px rgba(22,136,255,.2); }
    .btn.danger { color:var(--red); border-color:#f2cccc; background:#fffafa; }
    .btn.soft { color:#1977cd; background:var(--blue-soft); border-color:#d7ebff; }
    .btn svg { width:16px; height:16px; stroke:currentColor; fill:none; stroke-width:1.9; stroke-linecap:round; stroke-linejoin:round; }
    .stats { display:grid; grid-template-columns:repeat(5,minmax(0,1fr)); gap:12px; margin-bottom:14px; }
    .stat-card { min-width:0; padding:15px 16px; border:1px solid var(--line); border-radius:17px; background:rgba(255,255,255,.94); box-shadow:0 10px 27px rgba(30,55,84,.06); }
    .stat-top { display:flex; justify-content:space-between; align-items:center; gap:8px; color:var(--muted); }
    .stat-icon { width:32px; height:32px; display:grid; place-items:center; border-radius:10px; background:var(--blue-soft); color:var(--blue); }
    .stat-icon.green { background:var(--green-soft); color:var(--green); }
    .stat-icon.amber { background:var(--amber-soft); color:var(--amber); }
    .stat-icon.red { background:var(--red-soft); color:var(--red); }
    .stat-icon.purple { background:var(--purple-soft); color:var(--purple); }
    .stat-icon svg { width:17px; height:17px; stroke:currentColor; fill:none; stroke-width:1.8; stroke-linecap:round; stroke-linejoin:round; }
    .stat-value { margin-top:10px; display:flex; align-items:baseline; gap:7px; }
    .stat-value strong { font-size:25px; letter-spacing:-.7px; }
    .stat-value small { color:var(--green); }
    .stat-card > small { display:block; margin-top:5px; color:#9aa6b6; }
    .grid-2 { display:grid; grid-template-columns:minmax(0,1.55fr) minmax(300px,.9fr); gap:14px; margin-bottom:14px; }
    .grid-even { display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:14px; margin-bottom:14px; }
    .panel { min-width:0; border:1px solid var(--line); border-radius:18px; background:rgba(255,255,255,.95); box-shadow:0 10px 30px rgba(31,54,82,.055); overflow:hidden; }
    .panel-head { min-height:52px; display:flex; align-items:center; justify-content:space-between; gap:12px; padding:0 17px; border-bottom:1px solid #edf1f6; }
    .panel-head h3 { margin:0; font-size:15px; }
    .panel-head small { color:var(--muted); }
    .panel-body { padding:16px 17px; }
    .risk-chart { display:grid; grid-template-columns:180px minmax(0,1fr); gap:18px; align-items:center; min-height:185px; }
    .donut { width:158px; height:158px; margin:auto; border-radius:50%; display:grid; place-items:center; background:conic-gradient(var(--red) 0 12%, #f29a57 12% 34%, var(--amber) 34% 60%, var(--blue) 60% 79%, var(--green) 79%); position:relative; }
    .donut::after { content:""; width:106px; height:106px; background:white; border-radius:50%; position:absolute; }
    .donut-label { position:relative; z-index:1; text-align:center; }
    .donut-label strong { display:block; font-size:25px; }
    .donut-label span { color:var(--muted); font-size:11px; }
    .legend { display:grid; gap:10px; }
    .legend-row { display:grid; grid-template-columns:10px 1fr auto; align-items:center; gap:8px; }
    .legend-row i { width:9px; height:9px; border-radius:3px; }
    .legend-row span { color:#536174; }
    .legend-row strong { font-size:12px; }
    .run-list { display:grid; gap:12px; }
    .run-item { display:grid; grid-template-columns:38px minmax(0,1fr) auto; gap:11px; align-items:center; }
    .run-icon { width:38px; height:38px; display:grid; place-items:center; border-radius:12px; background:var(--blue-soft); color:var(--blue); font-weight:800; }
    .run-main { min-width:0; }
    .run-main strong { display:block; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; font-size:12px; }
    .run-meta { display:flex; gap:7px; color:var(--muted); font-size:10.5px; margin-top:5px; }
    .progress { height:6px; margin-top:7px; background:#edf2f7; border-radius:8px; overflow:hidden; }
    .progress i { display:block; height:100%; border-radius:8px; background:linear-gradient(90deg,var(--blue),#64b9ff); }
    .progress.green i { background:linear-gradient(90deg,var(--green),#67d6ae); }
    .progress.amber i { background:linear-gradient(90deg,var(--amber),#f5c672); }
    .status { display:inline-flex; align-items:center; gap:5px; height:23px; padding:0 9px; border-radius:12px; font-size:10.5px; font-weight:650; white-space:nowrap; }
    .status::before { content:""; width:6px; height:6px; border-radius:50%; background:currentColor; }
    .status.running, .status.info { color:#147cd8; background:var(--blue-soft); }
    .status.success, .status.explained { color:#198d64; background:var(--green-soft); }
    .status.warning, .status.pending { color:#b97815; background:var(--amber-soft); }
    .status.danger, .status.high { color:#d65353; background:var(--red-soft); }
    .status.neutral { color:#718095; background:#f0f3f7; }
    .toolbar { min-height:56px; display:flex; align-items:center; justify-content:space-between; gap:12px; padding:10px 13px; border:1px solid var(--line); border-bottom:0; border-radius:16px 16px 0 0; background:rgba(255,255,255,.92); }
    .toolbar-side { display:flex; align-items:center; gap:8px; flex-wrap:wrap; }
    .search { min-width:240px; height:35px; display:flex; align-items:center; gap:8px; padding:0 11px; border:1px solid var(--line-strong); border-radius:10px; background:white; }
    .search svg { width:16px; height:16px; stroke:#8c9aad; fill:none; stroke-width:1.9; }
    .search input { min-width:0; flex:1; border:0; outline:0; background:transparent; font-size:12px; }
    .select { height:35px; border:1px solid var(--line-strong); border-radius:10px; background:white; padding:0 29px 0 10px; outline:none; font-size:12px; }
    .table-wrap { overflow:auto; border:1px solid var(--line); border-radius:0 0 16px 16px; background:white; }
    .data-table { width:100%; border-collapse:separate; border-spacing:0; min-width:870px; }
    .data-table th { position:sticky; top:0; z-index:1; height:42px; padding:0 13px; color:#758399; background:#f7f9fc; border-bottom:1px solid var(--line); text-align:left; font-size:11px; font-weight:650; white-space:nowrap; }
    .data-table td { height:54px; padding:8px 13px; border-bottom:1px solid #eef2f6; color:#3c495c; vertical-align:middle; }
    .data-table tr:last-child td { border-bottom:0; }
    .data-table tbody tr { transition:.12s; }
    .data-table tbody tr:hover { background:#f8fbff; }
    .link { border:0; padding:0; color:#157cda; background:transparent; font-weight:650; text-align:left; }
    .subtext { display:block; margin-top:4px; color:#8995a6; font-size:10.5px; font-weight:400; }
    .risk { display:inline-flex; align-items:center; height:22px; padding:0 8px; border-radius:7px; font-size:10.5px; font-weight:700; }
    .risk.critical { background:#981f34; color:white; }
    .risk.high { background:var(--red-soft); color:#d65252; }
    .risk.medium { background:var(--amber-soft); color:#b97918; }
    .risk.low { background:var(--blue-soft); color:#2878c8; }
    .risk.none { background:var(--green-soft); color:#1b8b66; }
    .row-actions { display:flex; gap:5px; }
    .mini-btn { width:30px; height:30px; border:1px solid var(--line); border-radius:9px; display:grid; place-items:center; background:white; color:#6e7d90; }
    .mini-btn:hover { color:var(--blue); border-color:#c8e3ff; }
    .mini-btn svg { width:15px; height:15px; stroke:currentColor; fill:none; stroke-width:1.8; }
    .cards { display:grid; grid-template-columns:repeat(3,minmax(0,1fr)); gap:13px; }
    .entity-card { border:1px solid var(--line); border-radius:17px; background:white; overflow:hidden; transition:.16s; }
    .entity-card:hover { transform:translateY(-2px); box-shadow:0 12px 30px rgba(29,58,91,.09); }
    .card-visual { height:96px; position:relative; overflow:hidden; background:linear-gradient(135deg,#eef8ff,#f8fbff 48%,#e9faf4); }
    .card-visual::before, .card-visual::after { content:""; position:absolute; border-radius:22px; border:1px solid rgba(72,147,222,.2); background:rgba(255,255,255,.67); }
    .card-visual::before { width:145px; height:56px; left:22px; top:20px; transform:rotate(-3deg); }
    .card-visual::after { width:78px; height:78px; right:26px; top:9px; background:rgba(126,211,198,.24); }
    .visual-formula { position:absolute; z-index:1; left:42px; top:38px; color:#2388ea; font-size:19px; font-weight:800; letter-spacing:.5px; }
    .entity-body { padding:14px 15px; }
    .entity-body h3 { margin:0 0 6px; font-size:14px; }
    .entity-body p { margin:0; color:var(--muted); line-height:1.6; min-height:41px; font-size:11.5px; }
    .entity-meta { display:flex; justify-content:space-between; gap:8px; align-items:center; margin-top:12px; padding-top:11px; border-top:1px solid #eef2f6; color:#8290a2; font-size:10.5px; }
    .pipeline { display:grid; grid-template-columns:repeat(7,minmax(0,1fr)); gap:0; padding:18px 14px 11px; }
    .pipe-step { text-align:center; position:relative; min-width:0; }
    .pipe-step::after { content:""; height:2px; position:absolute; left:58%; right:-42%; top:15px; background:#dce5ee; }
    .pipe-step:last-child::after { display:none; }
    .pipe-dot { width:30px; height:30px; margin:0 auto 8px; display:grid; place-items:center; border-radius:50%; background:#edf2f7; color:#8e9aac; font-size:11px; font-weight:800; position:relative; z-index:1; }
    .pipe-step.done .pipe-dot { background:var(--green); color:white; }
    .pipe-step.done::after { background:var(--green); }
    .pipe-step.active .pipe-dot { background:var(--blue); color:white; box-shadow:0 0 0 5px rgba(22,136,255,.13); }
    .pipe-step span { display:block; color:#748298; font-size:10px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
    .detail-grid { display:grid; grid-template-columns:minmax(0,1.35fr) minmax(300px,.65fr); gap:14px; }
    .info-list { display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:0 24px; }
    .info-row { min-height:43px; display:grid; grid-template-columns:90px 1fr; gap:9px; align-items:center; border-bottom:1px dashed #e7edf4; }
    .info-row span { color:var(--muted); font-size:11px; }
    .info-row strong { font-size:11.5px; font-weight:600; overflow-wrap:anywhere; }
    .alert { display:flex; gap:11px; align-items:flex-start; padding:12px 14px; border:1px solid #f3d9ab; border-radius:13px; background:var(--amber-soft); color:#8a6425; line-height:1.55; }
    .alert.red { border-color:#f2cccc; background:var(--red-soft); color:#a84b4b; }
    .alert.blue { border-color:#d6eaff; background:var(--blue-soft); color:#2c70b2; }
    .formula { padding:14px 17px; border-radius:13px; background:linear-gradient(135deg,#edf7ff,#f8fbff); border:1px solid #d6e9fa; color:#167bd4; font:700 17px/1.4 Consolas,monospace; text-align:center; }
    .review-layout { display:grid; grid-template-columns:minmax(0,1.15fr) minmax(330px,.7fr); gap:14px; }
    .compare-grid { display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:10px; }
    .sheet-card { border:1px solid var(--line); border-radius:13px; overflow:hidden; }
    .sheet-head { padding:9px 11px; background:#f6f9fc; border-bottom:1px solid var(--line); font-size:10.5px; color:#627188; }
    .mini-sheet { width:100%; border-collapse:collapse; font-family:Consolas,monospace; font-size:10.5px; }
    .mini-sheet th, .mini-sheet td { height:28px; padding:0 8px; border-right:1px solid #edf1f5; border-bottom:1px solid #edf1f5; text-align:right; }
    .mini-sheet th { color:#7a8799; background:#fbfcfe; }
    .mini-sheet .hot { color:#bf4747; background:#fff0f0; font-weight:700; }
    .chart-box { margin-top:12px; border:1px solid var(--line); border-radius:13px; padding:11px; background:#fbfdff; }
    .chart-box svg { width:100%; height:150px; display:block; }
    .check-list { display:grid; gap:8px; }
    .check-item { display:grid; grid-template-columns:20px minmax(0,1fr) auto; gap:9px; align-items:start; padding:10px 11px; border:1px solid var(--line); border-radius:11px; background:white; }
    .check-item input { margin:2px 0 0; accent-color:var(--blue); }
    .check-item span { line-height:1.45; color:#4e5b6d; }
    .check-item small { color:var(--muted); }
    .timeline { display:grid; gap:0; }
    .timeline-item { display:grid; grid-template-columns:18px 1fr; gap:10px; padding-bottom:15px; }
    .timeline-marker { position:relative; }
    .timeline-marker::before { content:""; position:absolute; top:6px; left:5px; width:8px; height:8px; border-radius:50%; background:var(--blue); }
    .timeline-marker::after { content:""; position:absolute; top:17px; bottom:-11px; left:8px; width:1px; background:#dce5ee; }
    .timeline-item:last-child .timeline-marker::after { display:none; }
    .timeline-item strong { display:block; font-size:11.5px; }
    .timeline-item p { margin:4px 0 0; color:var(--muted); font-size:10.5px; line-height:1.55; }
    .kpi-bar { display:flex; align-items:center; gap:9px; }
    .kpi-bar .track { width:92px; height:7px; border-radius:7px; background:#edf2f6; overflow:hidden; }
    .kpi-bar .track i { display:block; height:100%; border-radius:7px; background:var(--blue); }
    .empty { padding:60px 20px; text-align:center; color:var(--muted); }
    .modal-layer { position:fixed; inset:0; z-index:50; display:none; place-items:center; padding:20px; background:rgba(18,31,49,.34); backdrop-filter:blur(8px); }
    .modal-layer.open { display:grid; }
    .modal { width:min(720px,calc(100vw - 34px)); max-height:90vh; overflow:auto; border:1px solid rgba(255,255,255,.9); border-radius:21px; background:white; box-shadow:0 28px 80px rgba(18,35,58,.26); }
    .modal-head { display:flex; align-items:center; justify-content:space-between; gap:15px; padding:18px 20px; border-bottom:1px solid var(--line); }

    function toast(title,message='') { const el=document.createElement('div'); el.className='toast'; el.innerHTML=`<i>✓</i><div><strong>${title}</strong><small>${message}</small></div>`; byId('toastStack').appendChild(el); setTimeout(()=>el.remove(),3600); }
    function audit(action,target,detail='') { state.auditTrail.unshift({time:new Date().toLocaleString('zh-CN',{hour12:false}),action,target,detail}); persist(); }
    function downloadText(filename,text,type='text/plain;charset=utf-8') {
      audit('导出文件',filename,`来源页面：${state.route}`);
      if(typeof Blob==='undefined'||typeof URL==='undefined'||!document.body) { toast('文件已生成',filename); return; }
      const url=URL.createObjectURL(new Blob([text],{type})); const a=document.createElement('a'); a.href=url; a.download=filename; document.body.appendChild(a); a.click(); a.remove(); setTimeout(()=>URL.revokeObjectURL(url),500);
      toast('文件已下载',filename);
    }

      else if(action==='generateReport'){title='生成报告版本';html=`<div class="form-grid">${field('项目','<select class="select" id="wfProject"><option>Human HDAC6 senses valine abundancy…</option><option>肿瘤代谢多组学标志物研究</option></select>',true)}${field('报告版本','<input id="wfVersion" value="v1.4" />')}${field('输出格式','<select class="select" id="wfFormat"><option>Word + PDF + HTML</option><option>Word</option><option>HTML</option></select>')}${field('范围声明','<textarea id="wfScope">包含已成功解析材料、当前规则覆盖、预算截断与未覆盖区域。</textarea>',true)}</div>`;}
      else if(action==='batchAssign'){title='批量分派线索';html=`<div class="check-list">${findings.map(f=>`<label class="check-item"><input type="checkbox" name="assignFinding" value="${f.id}"/><span>${f.id} · ${f.rule}</span><small>${f.status}</small></label>`).join('')}</div><div class="form-grid">${field('分派给','<select class="select" id="wfAssignee"><option>林知行 · 科研审查组</option><option>叶清扬 · 报告审核组</option><option>周明远 · 统计专家组</option></select>',true)}${field('截止日期','<input id="wfDue" type="date" value="2026-09-25" />')}${field('优先级','<select class="select" id="wfPriority"><option>高</option><option>普通</option></select>')}</div>`;}
      else if(action==='createRule'){title='创建检测规则';html=`<div class="form-grid">${field('规则名称','<input id="wfName" value="新建确定性规则" />')}${field('规则公式','<input id="wfFormula" value="B = A + c" />')}${field('适用范围','<input id="wfScope" value="数值型连续列" />')}${field('初始版本','<input id="wfVersion" value="0.1.0" />')}${field('规则说明','<textarea id="wfDesc">输出关系式、覆盖、残差和例外值。</textarea>',true)}${field('优先排除','<textarea id="wfExclude">单位换算、共享对照、公式派生。</textarea>',true)}</div>`;}
      else if(action==='importRule'){title='导入规则包';html=`<div class="form-grid">${field('规则包文件','<input id="wfFile" type="file" accept=".json,.zip" />',true)}${field('导入方式','<select class="select" id="wfMode"><option>创建草稿版本</option><option>覆盖未发布草稿</option></select>')}${field('签名校验','<select class="select"><option>必须通过</option></select>')}</div><div class="workflow-note" style="margin-top:14px">导入后仍需完成契约校验、回归测试、人工审核和发布门禁。</div>`;}
      else if(action==='createDetector'){title='注册确定性检测器';html=`<div class="form-grid">${field('检测器 ID','<input id="wfId" value="detector.custom_relation" />')}${field('名称','<input id="wfName" value="自定义关系检测" />')}${field('运行时','<select class="select" id="wfRuntime"><option>Python</option><option>R</option><option>Python + R</option></select>')}${field('版本','<input id="wfVersion" value="0.1.0" />')}${field('容器镜像','<input id="wfImage" value="registry/paperaudit/custom:0.1.0" />',true)}${field('输入输出契约','<textarea id="wfContract">输入：结构化数值块；输出：证据坐标、关系式、覆盖、残差和例外。</textarea>',true)}</div>`;}
      else if(action==='registerParser'){title='注册解析器';html=`<div class="form-grid">${field('解析器 ID','<input id="wfId" value="parser.custom_table" />')}${field('能力名称','<input id="wfName" value="自定义表格解析" />')}${field('支持格式','<input id="wfFormat" value="XLSX / CSV" />')}${field('版本','<input id="wfVersion" value="0.1.0" />')}${field('失败策略','<textarea id="wfFail">保留原文件、记录错误、允许切换解析器重试。</textarea>',true)}</div>`;}
      else if(action==='createCapability'){title=`创建${state.route==='agents'?' Agent':state.route==='skills'?' Skill':'测试集'}`;html=`<div class="form-grid">${field('名称','<input id="wfName" value="新建能力" />')}${field('版本','<input id="wfVersion" value="0.1.0" />')}${field('输入契约','<textarea id="wfInput">材料快照、任务参数与授权上下文。</textarea>',true)}${field('输出契约','<textarea id="wfOutput">结构化结果、错误码、覆盖与审计事件。</textarea>',true)}</div>`;}
      else if(action==='createAdmin'){title=`创建${routeMeta[state.route]?.[0]||'管理对象'}`;html=`<div class="form-grid">${field('名称','<input id="wfName" value="新建配置" />')}${field('类型 / 范围','<input id="wfType" value="项目级" />')}${field('角色 / 对象','<input id="wfTarget" value="科研审查组" />')}${field('生效状态','<select class="select" id="wfStatus"><option>草稿</option><option>已生效</option></select>')}${field('变更说明','<textarea id="wfNote">按最小权限原则创建。</textarea>',true)}</div>`;}
      else if(action==='addNode'){title='新增计算节点';html=`<div class="form-grid">${field('节点名称','<input id="wfName" value="worker-05" />')}${field('节点地址','<input id="wfAddress" value="10.24.8.25" />')}${field('角色','<select class="select" id="wfRole"><option>解析 / 扫描</option><option>规则扫描</option><option>Agent / 报告</option></select>')}${field('资源上限','<input id="wfQuota" value="16 CPU / 64 GB" />')}${field('接入令牌','<input id="wfToken" type="password" value="node-enroll-token" />',true)}</div>`;}
      else if(action==='log'){title=`运行日志 · ${id}`;sub='日志与运行快照保持同一任务版本';editable=false;html=`<pre class="log-view">09:18:02 INFO  snapshot verified · 14 files · sha256 ok\n09:18:11 INFO  parser.excel@3.6.2 · 30 sheets · 636 blocks\n09:20:44 INFO  detector.fixed_shift@2.4.1 · candidates 38\n09:21:06 INFO  benign-explanation challenge · filtered 21\n09:22:31 WARN  candidate limit reached on 3 large blocks\n09:23:18 INFO  checkpoint saved · coverage 96.2%\n09:24:03 INFO  waiting for human review</pre>`;}
      else if(action==='previewReport'){const r=reportRows.find(x=>x.id===id)||reportRows[0];title=`报告预览 · ${r.id}`;editable=false;html=`<article class="preview-page"><h2>论文科研数据异常筛查报告</h2><p style="text-align:center">${r.project} · ${r.version}</p><h3>执行摘要</h3><p>本次任务覆盖 14 个官方文件、30 张工作表和 636 个数据块。识别到 ${r.summary}，线索仅用于人工复核排序。</p><h3>关键线索</h3><p>FD-0041：两列 35 个值均满足 VR 24 h = VR 0 h + 0.300；当前材料未找到充分良性解释。</p><h3>覆盖声明</h3><p>任务状态为 partial。已报告关系可复现；解析失败、预算截断和规则未覆盖区域不能解释为不存在其他信号。</p></article>`;}
      else if(['ruleDetail','detectorDetail','parserDetail','capabilityDetail','adminDetail','ingestDetail','previewAsset'].includes(action)){title=`${id||'对象'} · 详情`;editable=false;html=`<div class="summary-list"><div><span>对象</span><b>${escapeHtml(id||'当前记录')}</b></div><div><span>版本 / 快照</span><b>已锁定 · 可追溯</b></div><div><span>权限</span><b>当前用户具备只读与配置权限</b></div><div><span>最近变更</span><b>2026-09-18 09:42 · 林知行</b></div><div><span>审计状态</span><b>输入、输出、哈希与操作记录完整</b></div></div><div class="workflow-note" style="margin-top:14px">正式交付中该详情对应独立后端资源，并使用版本号与乐观锁避免覆盖他人修改。</div>`;}
      else if(['testDetector','testParser'].includes(action)){title=`回归测试 · ${id}`;editable=false;html=`<div class="stats" style="grid-template-columns:repeat(3,1fr)">${statCard('通过','126','全部核心用例','green')}${statCard('失败','0','无阻塞项','blue')}${statCard('耗时','38.6s','固定镜像运行','purple')}</div><pre class="log-view">PASS contract.schema\nPASS missing-value cases\nPASS numeric precision\nPASS evidence coordinates\nPASS deterministic replay\nRESULT publish gate passed</pre>`;audit('执行回归测试',id,'全部门禁通过');}
      else if(action==='more'){title='更多操作';html=`<div class="check-list"><label class="check-item"><input type="radio" name="wfMore" value="version" checked/><span>创建新版本</span><small>保留当前版本</small></label><label class="check-item"><input type="radio" name="wfMore" value="sign"/><span>提交签名</span><small>进入审核队列</small></label><label class="check-item"><input type="radio" name="wfMore" value="archive"/><span>封存</span><small>锁定内容与证据包</small></label></div>`;}
      else if(action==='adminMore'){title=`管理操作 · ${id}`;html=`<div class="check-list"><label class="check-item"><input type="radio" name="wfAdminMore" value="scope" checked/><span>调整数据范围</span><small>重新计算最小权限</small></label><label class="check-item"><input type="radio" name="wfAdminMore" value="disable"/><span>停用</span><small>保留历史与审计记录</small></label><label class="check-item"><input type="radio" name="wfAdminMore" value="review"/><span>提交复核</span><small>进入管理员审核队列</small></label></div><div class="field"><label>操作原因</label><textarea id="wfNote">按权限治理流程调整。</textarea></div>`;}
      foot.innerHTML=editable?`<button class="btn" data-action="closeWorkflow">取消</button><button class="btn primary" data-action="submitWorkflow">${confirm}</button>`:`<button class="btn" data-action="closeWorkflow">关闭</button>`;
      byId('workflowTitle').textContent=title; byId('workflowSubtitle').textContent=sub; body.innerHTML=html; modal.classList.add('open');
    }
    function workflowValue(id,fallback=''){const el=byId(id);return el&&'value'in el&&el.value!==''?el.value:fallback;}
    function submitWorkflow(){
      const action=state.workflow,id=state.selectedId; let message='操作已完成';
      if(action==='addMaterial'){state.projectMaterials+=1;audit('补充材料',projects[0].id,workflowValue('wfNote'));message=`材料快照已更新为 v4，共 ${state.projectMaterials} 个文件`;}
      else if(action==='generateReport'){const rid=`RP-${new Date().toISOString().slice(0,10).replace(/-/g,'')}-${String(reportRows.length+23).padStart(3,'0')}`;reportRows.unshift({id:rid,project:workflowValue('wfProject','Human HDAC6…'),version:workflowValue('wfVersion','v1.4'),summary:'严重 1 · 高 2 · 中 3',status:'草稿',updated:'刚刚'});audit('生成报告',rid,workflowValue('wfScope'));message=`${rid} 已生成草稿`;state.route='reports';}
      else if(action==='batchAssign'){const checks=[...byId('workflowBody').querySelectorAll('input[name="assignFinding"]:checked')];const ids=checks.map(x=>x.value);(ids.length?ids:[findings[0].id]).forEach(fid=>{const f=findings.find(x=>x.id===fid);if(f)f.status='待人工';});audit('批量分派',ids.join(',')||findings[0].id,workflowValue('wfAssignee'));message=`已分派 ${Math.max(1,ids.length)} 条线索`;}
      else if(action==='createRule'){state.created.rules.push([workflowValue('wfName'),workflowValue('wfDesc'),workflowValue('wfExclude'),workflowValue('wfVersion','0.1.0'),workflowValue('wfFormula')]);audit('创建规则',workflowValue('wfName'),'草稿');message='规则草稿已创建并进入测试队列';}
      else if(action==='importRule'){state.created.rules.push(['导入规则包','来自签名规则包，等待契约校验。','版本冲突与未签名依赖','0.1.0','imported']);audit('导入规则包','导入规则包','草稿');message='规则包已导入为草稿';}
      else if(action==='createDetector'){state.created.detectors.push([workflowValue('wfId'),workflowValue('wfName'),workflowValue('wfRuntime'),workflowValue('wfVersion'),'0 / 0','草稿']);audit('注册检测器',workflowValue('wfId'),workflowValue('wfImage'));message='检测器已注册，发布前需通过回归门禁';}
      else if(action==='registerParser'){state.created.parsers.push([workflowValue('wfId'),workflowValue('wfName'),workflowValue('wfFormat'),workflowValue('wfVersion'),'待测试','草稿']);audit('注册解析器',workflowValue('wfId'),workflowValue('wfFail'));message='解析器已注册为草稿';}
      else if(action==='createCapability'){state.created[state.route].push(workflowValue('wfName'));audit('创建能力',workflowValue('wfName'),state.route);message='能力草稿已创建';}
      else if(action==='createAdmin'){state.created[state.route].push([workflowValue('wfName'),workflowValue('wfType'),workflowValue('wfTarget'),workflowValue('wfStatus','草稿')].join('|'));audit('创建管理对象',workflowValue('wfName'),state.route);message='管理对象已创建';}
      else if(action==='addNode'){state.created.nodes.push([workflowValue('wfName'),workflowValue('wfRole'),'0%','0%','0','刚刚','在线']);audit('新增节点',workflowValue('wfName'),workflowValue('wfAddress'));message='节点已完成登记并通过首次心跳';}
      else if(action==='more'){const chosen=byId('workflowBody').querySelector('input[name="wfMore"]:checked');const op=chosen?chosen.value:'version';const r=reportRows.find(x=>x.id===id);if(r){if(op==='version')r.version=`v${(parseFloat(r.version.slice(1))+.1).toFixed(1)}`;if(op==='sign')r.status='待签名';if(op==='archive')r.status='已封存';}audit('报告更多操作',id,op);message='报告状态与版本已更新';}
      else if(action==='adminMore'){const chosen=byId('workflowBody').querySelector('input[name="wfAdminMore"]:checked');const op=chosen?chosen.value:'scope';audit('管理对象操作',id,`${op}：${workflowValue('wfNote')}`);message='管理操作已提交并进入审计记录';}
      byId('workflowModal').classList.remove('open'); render(); toast(message,'变更已写入当前会话审计记录。');
    }
    function bindSearch() {
      const input=content.querySelector('[data-table-search]');
      const applyFilters=()=>{const q=(input?.value||'').trim().toLowerCase();const filters=[...content.querySelectorAll('[data-table-filter]')].map(x=>x.value).filter(v=>!v.startsWith('全部'));content.querySelectorAll('[data-filter-table] tbody tr').forEach(tr=>{const text=tr.textContent.toLowerCase();tr.style.display=text.includes(q)&&filters.every(v=>text.includes(v.toLowerCase()))?'':'none';});};
      if(input) input.addEventListener('input',e=>{input.value=e.target.value;applyFilters();});
      content.querySelectorAll('[data-table-filter]').forEach(select=>select.addEventListener('change',applyFilters));
      const cardInput=content.querySelector('[data-card-search]');
      if(cardInput) cardInput.addEventListener('input',e=>{const q=e.target.value.trim().toLowerCase();content.querySelectorAll('[data-filter-cards] .entity-card').forEach(card=>card.style.display=card.textContent.toLowerCase().includes(q)?'':'none');});
    }

    document.addEventListener('click',e=>{
      const routeEl=e.target.closest('[data-route]');
      const route=routeEl?.dataset.route;
      if(route) { if(route==='project-detail'&&routeEl.dataset.id)state.selectedProjectId=routeEl.dataset.id;if((route==='finding-detail'||route==='review')&&routeEl.dataset.id)state.selectedFindingId=routeEl.dataset.id;setRoute(route); return; }
      const actionEl=e.target.closest('[data-action]');
      const action=actionEl?.dataset.action;
      const recordId=actionEl?.dataset.id||'';
      if(action==='openScan') openWizard();
      else if(action==='closeModal') byId('scanModal').classList.remove('open');
      else if(action==='wizardPrev') { state.wizard=Math.max(1,state.wizard-1); renderWizard(); }
      else if(action==='wizardNext') { if(state.wizard<3){state.wizard++;renderWizard();}else{const id=`PA-RUN-${new Date().toISOString().slice(5,10).replace('-','')}-${String(runRows.length+27).padStart(3,'0')}`;runRows.unshift({id,project:'新建论文筛查',stage:'材料预检',progress:'2%',coverage:'等待冻结快照',elapsed:'刚刚',status:'运行中'});audit('创建筛查任务',id,`${state.source} / ${state.strategy}`);byId('scanModal').classList.remove('open');toast('筛查任务已创建',`${id} 已进入材料预检队列。`);setRoute('runs');} }
      else if(action==='notifications') byId('noticePopover').classList.toggle('open');
      else if(action==='readAll') { byId('noticePopover').classList.remove('open'); document.querySelector('.notify-dot').style.display='none'; toast('通知已全部标记为已读'); }
      else if(action==='mobileMenu') byId('sidebar').classList.toggle('open');
      else if(action==='openProject') {if(recordId)state.selectedProjectId=recordId;setRoute('project-detail');}
      else if(action==='openFinding') {if(recordId)state.selectedFindingId=recordId;setRoute('finding-detail');}
      else if(action==='explainFinding') { const note=byId('reviewNote')?.value||'';const finding=findings.find(x=>x.id===state.selectedFindingId)||findings[0];state.reviewStatus='已解释';finding.status='已解释';audit('人工裁定',finding.id,`已解释：${note}`);toast('线索已标记为已解释','复核记录已追加，原始检测证据保持不变。'); render(); }
      else if(action==='escalateFinding') { const note=byId('reviewNote')?.value||'';const finding=findings.find(x=>x.id===state.selectedFindingId)||findings[0];state.reviewStatus='升级人工核验';finding.status='升级人工核验';audit('人工裁定',finding.id,`升级人工核验：${note}`);toast('已升级人工核验','已通知科研审查负责人，并锁定当前证据快照。'); render(); }
      else if(action==='exportReport'||action==='export'||action==='downloadAsset') exportCurrent(recordId);
      else if(action==='pause'||action==='resume'||action==='retry') { const task=runRows.find(r=>r.id===recordId);if(task){task.status=action==='pause'?'已暂停':'运行中';if(action==='retry'){task.progress='1%';task.stage='恢复检查点';}audit(action==='pause'?'暂停任务':action==='resume'?'继续任务':'重试任务',recordId,'保留原运行记录');render();toast(task.status,`${recordId} 的检查点和原运行记录已保留。`);}else{openWorkflow('testParser',recordId||'失败文件重解析');} }
      else if(action==='saveSettings') { content.querySelectorAll('[data-setting]').forEach(el=>state.settings[el.dataset.setting]=el.value);audit('保存设置',state.route,JSON.stringify(state.settings));toast('设置已保存','新建任务将使用更新后的默认策略。');render(); }
      else if(action==='closeWorkflow') byId('workflowModal').classList.remove('open');
      else if(action==='submitWorkflow') submitWorkflow();
      else if(['addMaterial','generateReport','batchAssign','createRule','importRule','createDetector','registerParser','createCapability','createAdmin','addNode','log','previewReport','more','adminMore','ruleDetail','detectorDetail','parserDetail','capabilityDetail','adminDetail','ingestDetail','previewAsset','testDetector','testParser'].includes(action)) openWorkflow(action,recordId);
      const source=e.target.closest('[data-source]')?.dataset.source; if(source){state.source=source;renderWizard();}
      const strategy=e.target.closest('[data-strategy]')?.dataset.strategy; if(strategy){state.strategy=strategy;renderWizard();}
      if(e.target.closest('[data-select-all]')) content.querySelectorAll('[data-finding-select]').forEach(x=>x.checked=e.target.checked);
    });
    byId('consoleSelect').addEventListener('change',e=>{state.console=e.target.value;state.route=consoles[state.console].routes[0][0];history.replaceState(null,'','#'+state.route);render();});
    byId('scanModal').addEventListener('click',e=>{if(e.target===byId('scanModal'))byId('scanModal').classList.remove('open');});
    byId('workflowModal').addEventListener('click',e=>{if(e.target===byId('workflowModal'))byId('workflowModal').classList.remove('open');});
    document.addEventListener('keydown',e=>{if(e.key==='Escape'){byId('scanModal').classList.remove('open');byId('workflowModal').classList.remove('open');byId('noticePopover').classList.remove('open');}});
    document.querySelector('[data-action="mobileMenu"]').innerHTML=icon('menu');
    document.querySelector('[data-action="notifications"]').insertAdjacentHTML('afterbegin',icon('bell'));
    document.querySelector('[data-action="closeModal"]').innerHTML=icon('close');
    document.querySelector('[data-action="closeWorkflow"]').innerHTML=icon('close');
    const initial=location.hash.slice(1); if(initial&&routeMeta[initial]) state.route=initial;
    const initialConsole=Object.entries(consoles).find(([,c])=>c.routes.some(r=>r[0]===state.route)); if(initialConsole) state.console=initialConsole[0];
    render();
  </script>
</body>
